<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">SENTINEL automotive security firmware</title>
  <desc id="desc">Dark automotive instrument panel with cyan radar, amber CAN activity and green system indicators.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05090c"/>
      <stop offset="1" stop-color="#151b20"/>
    </linearGradient>
    <radialGradient id="radar">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#panel)"/>
  <path d="M0 260H1200M0 280H1200M0 300H1200" stroke="#26323a" stroke-width="1"/>
  <path d="M40 0V320M80 0V320M1120 0V320M1160 0V320" stroke="#1d272d" stroke-width="1"/>
  <circle cx="164" cy="160" r="112" fill="url(#radar)" stroke="#00e5ff" stroke-width="2"/>
  <circle cx="164" cy="160" r="76" fill="none" stroke="#00e5ff" stroke-opacity=".55"/>
  <circle cx="164" cy="160" r="38" fill="none" stroke="#00e5ff" stroke-opacity=".4"/>
  <path d="M52 160H276M164 48V272M164 160L244 91" stroke="#00e5ff" stroke-opacity=".6"/>
  <circle cx="219" cy="113" r="5" fill="#ffb000" filter="url(#glow)"/>
  <circle cx="116" cy="205" r="4" fill="#39ff88" filter="url(#glow)"/>
  <text x="330" y="137" fill="#eefcff" font-family="monospace" font-size="76" font-weight="700" letter-spacing="14">SENTINEL</text>
  <text x="334" y="184" fill="#00e5ff" font-family="monospace" font-size="22" letter-spacing="5">AUTOMOTIVE SECURITY FIRMWARE</text>
  <path d="M334 215H1028" stroke="#00e5ff" stroke-width="2"/>
  <path d="M334 232h85l18-16 18 33 20-28 21 11h82l15-10 17 10h93l17-19 18 32 19-13h85" fill="none" stroke="#ffb000" stroke-width="3" filter="url(#glow)"/>
  <g font-family="monospace" font-size="16" font-weight="700">
    <text x="334" y="281" fill="#39ff88">● SYSTEM READY</text>
    <text x="544" y="281" fill="#ffb000">◆ CAN ACTIVITY</text>
    <text x="750" y="281" fill="#00e5ff">◉ M5STICKC PLUS2</text>
    <text x="1035" y="281" fill="#ff3b4d">TX LOCK</text>
  </g>
</svg>
